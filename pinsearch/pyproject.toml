[project]
name = "pinsearch"
version = "1.0.0"
description = "Advanced Pinterest search."
readme = "README.md"
authors = [
    { name = "Caden Finkelstein", email = "me@cadenf.com" }
]
requires-python = ">=3.14"
dependencies = [
    "httpx>=0.28.1",
    "textual>=8.2.8",
]

[project.scripts]
pinsearch = "src:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
only-include = ["src", "lib"]

[tool.hatch.build.targets.wheel.sources]
"src" = ""
